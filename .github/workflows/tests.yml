name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install trafilatura certifi
      - run: python -m unittest discover -s tests -p "test_*.py"

  windows-downloads:
    name: real downloads on Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the download engines
        run: |
          python -m pip install trafilatura certifi "yt-dlp[default]" gallery-dl || exit /b 1
          choco install ffmpeg -y --no-progress || exit /b 1
          powershell -NoProfile -Command "irm https://deno.land/install.ps1 | iex" || exit /b 1
          npm install --prefix "%LOCALAPPDATA%\Universal Content Intake\runtime\single-file-cli" single-file-cli@2.15.7
      - name: First-run choices and environment check
        run: |
          call bin\uci settings --monitoring off --subtitles off || exit /b 1
          call bin\uci setup doctor
          call bin\uci help
      - name: PowerShell can start it too
        shell: pwsh
        run: |
          .\bin\uci.cmd help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          bin\uci help
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Document
        run: call bin\uci https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf --to "%RUNNER_TEMP%\uci-out"
      - name: Image
        run: call bin\uci https://upload.wikimedia.org/wikipedia/commons/4/47/PNG_transparency_demonstration_1.png --to "%RUNNER_TEMP%\uci-out"
      - name: Article
        run: call bin\uci https://en.wikipedia.org/wiki/Windows_10 --to "%RUNNER_TEMP%\uci-out"
      - name: Web page (SingleFile + Chrome)
        run: |
          call bin\uci --type webpage https://example.com --to "%RUNNER_TEMP%\uci-out"
      - name: Video (yt-dlp + ffmpeg)
        run: |
          call bin\uci https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/360/Big_Buck_Bunny_360_10s_1MB.mp4 --to "%RUNNER_TEMP%\uci-out"
      - name: WeChat Channels links are refused with an explanation
        run: |
          call bin\uci https://weixin.qq.com/sph/AmZAkab0Lb
          if %ERRORLEVEL% NEQ 2 exit /b 1
          exit /b 0
      - name: Delivered files
        if: always()
        run: dir /s /b "%RUNNER_TEMP%\uci-out"
      - name: Maintenance tasks in Task Scheduler
        run: |
          call bin\uci setup launchagent install || exit /b 1
          schtasks /Query /TN "\Universal Content Intake\ytdlp-update" || exit /b 1
          schtasks /Query /TN "\Universal Content Intake\engine-check" || exit /b 1
          schtasks /Run /TN "\Universal Content Intake\engine-check" || exit /b 1
          powershell -Command "Start-Sleep -Seconds 60"
          type "%LOCALAPPDATA%\Universal Content Intake\Logs\engine-check.log"
          call bin\uci setup launchagent uninstall || exit /b 1
          schtasks /Query /TN "\Universal Content Intake\ytdlp-update" && exit /b 1
          exit /b 0
      - name: Notifications do not crash
        run: python -c "from src.core import compat; compat.notify('UCI', 'test')"
      - name: SingleFile diagnostics
        if: failure()
        run: |
          set "SF=%LOCALAPPDATA%\Universal Content Intake\runtime\single-file-cli\node_modules\single-file-cli"
          dir "%SF%"
          "%USERPROFILE%\.deno\bin\deno.exe" run --allow-read --allow-write --allow-net --allow-env --allow-run "%SF%\single-file" https://example.com "%RUNNER_TEMP%\sf.html" --browser-headless=true "--browser-executable-path=C:\Program Files\Google\Chrome\Application\chrome.exe"
          dir "%RUNNER_TEMP%\sf.html"

  windows-subtitles:
    name: Chinese subtitles on Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: models/*.bin
          key: whisper-models-small-silero-v6.2.0
      - name: Install the download engines
        run: |
          python -m pip install trafilatura certifi "yt-dlp[default]" || exit /b 1
          choco install ffmpeg -y --no-progress || exit /b 1
      - name: Turn subtitles on and install speech recognition
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          call bin\uci settings --monitoring off --subtitles on || exit /b 1
          call bin\uci setup build-tools || exit /b 1
      - name: Use a stand-in for the translation API (CI has no real key)
        run: |
          start "" /b python tests\fixtures\fake_translation_server.py 8765
          powershell -NoProfile -Command "Start-Sleep -Seconds 3"
          call bin\uci setup translation use deepseek --base-url http://127.0.0.1:8765 --model stand-in || exit /b 1
          echo sk-test| bin\uci setup translation key || exit /b 1
          call bin\uci setup doctor
          exit /b 0
      - name: A short English speech video
        run: |
          mkdir "%RUNNER_TEMP%\media"
          curl -sSfL -o "%RUNNER_TEMP%\media\jfk.wav" https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav || exit /b 1
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=navy:s=640x360:r=25 -i "%RUNNER_TEMP%\media\jfk.wav" -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac "%RUNNER_TEMP%\media\jfk.mp4" || exit /b 1
      - name: Download, recognise, translate and burn in
        run: |
          rem Background servers do not outlive their step, so both are started here.
          start "" /b python tests\fixtures\fake_translation_server.py 8765
          start "" /b python -m http.server 8766 --bind 127.0.0.1 --directory "%RUNNER_TEMP%\media"
          powershell -NoProfile -Command "Start-Sleep -Seconds 3"
          call bin\uci http://127.0.0.1:8766/jfk.mp4 --zh --to "%RUNNER_TEMP%\uci-zh" || exit /b 1
          dir /s /b "%RUNNER_TEMP%\uci-zh"
          for %%f in ("%RUNNER_TEMP%\uci-zh\*.mp4") do set "VIDEO=%%f"
          ffprobe -hide_banner -loglevel error -show_entries stream=codec_type,width,height -of compact "%VIDEO%" || exit /b 1
          ffmpeg -hide_banner -loglevel error -ss 5 -i "%VIDEO%" -frames:v 1 "%RUNNER_TEMP%\uci-zh\frame.png" || exit /b 1
          type "%RUNNER_TEMP%\uci-zh\*.md"
      - name: The monitoring Worker's Core runner, for real (full run, then a cancelled one)
        run: |
          start "" /b python tests\fixtures\fake_translation_server.py 8765
          start "" /b python -m http.server 8766 --bind 127.0.0.1 --directory "%RUNNER_TEMP%\media"
          powershell -NoProfile -Command "Start-Sleep -Seconds 3"
          set "PYTHONUTF8=1"
          python tests\fixtures\core_runner_check.py http://127.0.0.1:8766/jfk.mp4 "%RUNNER_TEMP%\worker-jobs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-subtitle-frame
          path: ${{ runner.temp }}/uci-zh/frame.png
          if-no-files-found: ignore

  windows-monitoring:
    name: Monitoring pieces on Windows (secret, Worker task)
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install trafilatura certifi "yt-dlp[default]"
      - name: Shared secret in Credential Manager and on the clipboard
        run: |
          call bin\uci settings --monitoring off --subtitles off || exit /b 1
          call bin\uci setup secret create || exit /b 1
          call bin\uci setup secret create && exit /b 1
          call bin\uci setup secret copy || exit /b 1
          powershell -NoProfile -Command "if ((Get-Clipboard).Length -lt 40) { exit 1 }" || exit /b 1
          exit /b 0
      - name: The Worker runs as a Task Scheduler task and stops with everything it started
        run: |
          call bin\uci settings --monitoring on
          call bin\uci setup launchagent install || exit /b 1
          powershell -NoProfile -Command "Start-Sleep -Seconds 20"
          schtasks /Query /TN "\Universal Content Intake\worker" /FO LIST
          powershell -NoProfile -Command "$n = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -like 'python*' -and $_.CommandLine -like '*src.queue.worker_cli*' }).Count; Write-Output \"worker processes: $n\"; if ($n -lt 1) { exit 1 }" || exit /b 1
          type "%LOCALAPPDATA%\Universal Content Intake\Logs\worker.stderr.log"
          call bin\uci setup launchagent uninstall || exit /b 1
          powershell -NoProfile -Command "Start-Sleep -Seconds 5; $n = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -like 'python*' -and ($_.CommandLine -like '*src.queue.worker_cli*' -or $_.CommandLine -like '*scheduled_run*') }).Count; Write-Output \"left after uninstall: $n\"; if ($n -gt 0) { exit 1 }" || exit /b 1
          exit /b 0
