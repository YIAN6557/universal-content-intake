name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install trafilatura certifi
      - run: python -m unittest discover -s tests -p "test_*.py"

  windows-downloads:
    name: real downloads on Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the download engines
        run: |
          python -m pip install trafilatura certifi "yt-dlp[default]" gallery-dl || exit /b 1
          choco install ffmpeg deno -y --no-progress || exit /b 1
          npm install --prefix "%LOCALAPPDATA%\Universal Content Intake\runtime\single-file-cli" single-file-cli@2.15.7
      - name: First-run choices and environment check
        run: |
          call bin\uci settings --monitoring off --subtitles off || exit /b 1
          call bin\uci setup doctor
          call bin\uci help
      - name: PowerShell can start it too
        shell: pwsh
        run: |
          .\bin\uci.cmd help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          bin\uci help
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Document
        run: call bin\uci https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf --to "%RUNNER_TEMP%\uci-out"
      - name: Image
        run: call bin\uci https://upload.wikimedia.org/wikipedia/commons/4/47/PNG_transparency_demonstration_1.png --to "%RUNNER_TEMP%\uci-out"
      - name: Article
        run: call bin\uci https://en.wikipedia.org/wiki/Windows_10 --to "%RUNNER_TEMP%\uci-out"
      - name: Web page (SingleFile + Chrome)
        run: |
          call bin\uci --type webpage https://example.com --to "%RUNNER_TEMP%\uci-out"
      - name: Video (yt-dlp + ffmpeg)
        run: |
          call bin\uci https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/360/Big_Buck_Bunny_360_10s_1MB.mp4 --to "%RUNNER_TEMP%\uci-out"
      - name: WeChat Channels links are refused with an explanation
        run: |
          call bin\uci https://weixin.qq.com/sph/AmZAkab0Lb
          if %ERRORLEVEL% NEQ 2 exit /b 1
          exit /b 0
      - name: Delivered files
        if: always()
        run: dir /s /b "%RUNNER_TEMP%\uci-out"
      - name: Maintenance tasks in Task Scheduler
        run: |
          call bin\uci setup launchagent install || exit /b 1
          schtasks /Query /TN "\Universal Content Intake\ytdlp-update" || exit /b 1
          schtasks /Query /TN "\Universal Content Intake\engine-check" || exit /b 1
          schtasks /Run /TN "\Universal Content Intake\engine-check" || exit /b 1
          powershell -Command "Start-Sleep -Seconds 60"
          type "%LOCALAPPDATA%\Universal Content Intake\Logs\engine-check.log"
          call bin\uci setup launchagent uninstall || exit /b 1
          schtasks /Query /TN "\Universal Content Intake\ytdlp-update" && exit /b 1
          exit /b 0
      - name: Notifications do not crash
        run: python -c "from src.core import compat; compat.notify('UCI', 'test')"
      - name: SingleFile diagnostics
        if: failure()
        run: |
          set "SF=%LOCALAPPDATA%\Universal Content Intake\runtime\single-file-cli\node_modules\single-file-cli"
          dir "%SF%"
          node "%SF%\single-file-node.js" --version
          node "%SF%\single-file-node.js" https://example.com "%RUNNER_TEMP%\sf.html" --browser-headless=true "--browser-executable-path=C:\Program Files\Google\Chrome\Application\chrome.exe"
          dir "%RUNNER_TEMP%\sf.html"
