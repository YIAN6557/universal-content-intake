[project]
name = "universal-content-intake"
version = "0.2.0"
description = "Mac toolkit that monitors YouTube creators and automatically downloads, translates and subtitles their new videos, and a one-link downloader for videos, PDFs, images, articles and web pages."
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "YIAN6557"}]
dependencies = ["trafilatura>=2.2,<3", "certifi>=2025.1.31"]

[project.urls]
Repository = "https://github.com/YIAN6557/universal-content-intake"

[tool.uci]
test_command = "python3 -m unittest discover -s tests -v"

# This workspace intentionally has no packaging backend. Invoke the CLI with
# `python3 -m src.cli`; ARTICLE and WEBPAGE Markdown extraction use the
# separately installed Trafilatura dependency declared above. WEBPAGE also
# invokes an installed SingleFile CLI and the system Google Chrome executable.
